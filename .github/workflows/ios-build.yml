name: iOS CI/CD Build & Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App (macOS Runner)
    runs-on: macos-14 # Apple Silicon M2 runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          # Default to latest installed Xcode 15.x / 16.x
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Run Unit Tests (KVTubeTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "ios-app/KVTube.xcodeproj" \
            -scheme "KVTube" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath "ios-app/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO | xcpretty || true

      - name: Build iOS Simulator App Bundle
        run: |
          set -o pipefail
          xcodebuild build \
            -project "ios-app/KVTube.xcodeproj" \
            -scheme "KVTube" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "ios-app/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Locate and Package Simulator App Bundle
        run: |
          APP_PATH=$(find ios-app/build/DerivedData/Build/Products/Release-iphonesimulator -name "KVTube.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find KVTube.app in build output directory!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          mkdir -p ios-app/dist
          cd "$(dirname "$APP_PATH")"
          zip -r -y "${GITHUB_WORKSPACE}/ios-app/dist/KVTube-Simulator.zip" "KVTube.app"
          echo "Package size: $(ls -lh "${GITHUB_WORKSPACE}/ios-app/dist/KVTube-Simulator.zip" | awk '{print $5}')"

      - name: Build and Package iOS .ipa (Device Target)
        run: |
          set -o pipefail
          ./ios-app/scripts/build-ipa.sh

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KVTube-Simulator
          path: ios-app/dist/KVTube-Simulator.zip
          retention-days: 14

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KVTube-IPA
          path: ios-app/dist/KVTube.ipa
          retention-days: 14

      - name: Generate Workflow Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📱 KV-Tube iOS Build Summary

          - **Target Platform:** iOS 17.0+ Simulator & Device
          - **Configuration:** `Release`
          - **Artifacts:**
            - `KVTube-Simulator.zip`: For Apple iOS Simulator & [Appetize.io](https://appetize.io/upload)
            - `KVTube.ipa`: For physical device sideloading via AltStore, SideStore, Sideloadly, or TrollStore
          EOF
