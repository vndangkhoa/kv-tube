services:
  kv-tube:
    image: git.khoavo.myds.me/vndangkhoa/kv-tube:staging

    container_name: kv-tube
    platform: linux/amd64
    restart: unless-stopped

    ports:
      - "5011:3000"   # Frontend (Next.js)
      - "8981:8080"   # Backend API (Go)

    volumes:
      - ./data:/app/data
      - ./cookies.txt:/app/data/cookies.txt  # Optional: for YouTube comments support

    environment:
      - KVTUBE_DATA_DIR=/app/data
      - YTDLP_COOKIES=/app/data/cookies.txt  # Comment out if no cookies.txt
      - GIN_MODE=release
      - NODE_ENV=production
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5011

    devices:
      - /dev/ptmx  # Required for downloads

    labels:
      - "com.centurylinklabs.watchtower.enable=true"
