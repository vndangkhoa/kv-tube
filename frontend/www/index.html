<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>KV-Tube</title>
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .splash-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .logo-circle {
            width: 88px;
            height: 88px;
            background: #ff0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            margin-bottom: 20px;
        }
        .play-triangle {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 16px 0 16px 28px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px;
        }
        .app-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .app-status {
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>
<body>
    <div class="splash-loader" id="splash">
        <div class="logo-circle">
            <div class="play-triangle"></div>
        </div>
        <div class="app-name">KV-Tube</div>
        <div class="app-status">Connecting to home portal...</div>
    </div>

    <iframe id="app-frame" src="http://localhost:3241" allow="autoplay; fullscreen; picture-in-picture"></iframe>

    <script>
        // Check local backend vs fallback
        const frame = document.getElementById('app-frame');
        const splash = document.getElementById('splash');

        frame.onload = () => {
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }, 500);
        };

        // Fallback if local port not reachable: retry or prompt
        setTimeout(() => {
            if (splash.style.display !== 'none') {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }
        }, 3000);
    </script>
</body>
</html>
